# Temporary diagnostic workflow — verifies what's preinstalled on the ubuntu-slim runner image.
# Not for merge; deleted after use.
name: "_tmp yq probe"

permissions: {}

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-slim
    steps:
      - name: Probe yq and docker
        run: |
          echo "== yq =="
          which yq && yq --version || echo "yq: NOT FOUND"
          echo "== docker CLI =="
          which docker && docker --version || echo "docker CLI: NOT FOUND"
          echo "== docker daemon =="
          docker info > /dev/null 2>&1 && echo "docker daemon: RUNNING" || echo "docker daemon: NOT RUNNING / NOT REACHABLE"
          echo "== jq (sanity check, known to be standard) =="
          which jq && jq --version || echo "jq: NOT FOUND"
